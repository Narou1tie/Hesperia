<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le bordel d'Hesperia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --panel-bg: rgba(18, 18, 26, 0.85);
            --cyan: #03fcf0;
            --fuchsia: #fc037f;
            --violet: #ad03fc;
            --text-main: #e0e0ff;
            --text-muted: #9494b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(173, 3, 252, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(252, 3, 127, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(3, 252, 240, 0.08) 0%, transparent 50%);
        }

        /* CORRECTION : On a enlevé le "h " qui trainait devant header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            position: relative; 
            display: flex;
            align-items: center;
        }

        /* 3. Ton logo géant en absolute, qui ne fait PAS grandir le header, et qui obéit enfin au left ! */
        .logo img {
            position: absolute; 
            left: -60px;   /* <--- Mets des pixels négatifs (-10px, -30px...) pour le pousser vers la gauche, ou positifs pour la droite */
            top: -10px;    /* <--- Pour le descendre ou le remonter par rapport au haut du header */
            
            height: 150px; /* Ta taille géante */
            width: auto;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s ease;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: var(--cyan);
            text-shadow: 0 0 8px var(--cyan);
        }

        /* Menu Déroulant Desktop */
        .dropdown { position: relative; }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--panel-bg);
            border: 1px solid rgba(173, 3, 252, 0.3);
            border-radius: 8px;
            list-style: none;
            padding: 0.5rem 0;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 101;
        }
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(5px);
        }
        .dropdown-menu a { display: block; padding: 0.7rem 1.2rem; }

        /* Bouton Burger (Caché sur PC) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--cyan);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 1000;
        }

        /* --- RESPONSIVE MOBILE (Écrans <= 768px) --- */
        @media (max-width: 768px) {
            /* 1. On cache définitivement le gros logo sur mobile */
            .logo {
                display: none !important;
            }

            /* 2. On affiche le bouton Burger */
            .menu-toggle {
                display: block;
            }

            /* 3. Le menu se transforme en panneau / bulle plein écran */
            nav ul {
                position: fixed;
                top: 0;
                right: -100%; /* Caché hors de l'écran par défaut */
                width: 75%;
                max-width: 300px;
                height: 100vh;
                background: rgba(10, 10, 15, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                padding: 3rem;
                gap: 2rem;
                box-shadow: -10px 0 30px rgba(0,0,0,0.8);
                border-left: 1px solid rgba(173, 3, 252, 0.2);
                transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 999;
            }

            /* Quand on active la classe "open", le menu glisse sur l'écran */
            nav ul.open {
                right: 0;
            }

            /* Adaptation du menu déroulant sur mobile pour qu'il soit ouvert directement */
            .dropdown-menu {
                position: static;
                transform: none;
                opacity: 1;
                visibility: visible;
                box-shadow: none;
                background: transparent;
                border: none;
                padding-left: 1rem;
                margin-top: 0.5rem;
            }
            
            .dropdown > a::after {
                content: ''; 
            }
        }

        /* Contenu principal épuré */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        h1 span {
            background: linear-gradient(135deg, var(--cyan), var(--fuchsia), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(252, 3, 127, 0.25);
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 15, 0.5);
        }
    </style>
</head>
<body>

   <!-- Barre de Navigation -->
    <header>
        <div class="logo">
            <a href="index.html"><img src="images/logo.gif" alt="Logo Hesperia"></a>
        </div>

        <!-- Bouton Burger pour mobile -->
        <button class="menu-toggle" id="menu-btn">☰</button>

        <nav>
            <ul id="nav-links">
                <li><a href="index.html" class="main-link">Accueil</a></li>
                <li><a href="#" class="main-link">Présentation RP</a></li>
                
                <li class="dropdown">
                    <a href="#" class="main-link active">Quiz & Tests</a>
                    <ul class="dropdown-menu">
                        <li><a href="lover_test.html" class="active" style="color: var(--cyan);">Qui est ton âme-soeur ?</a></li>
                    </ul>
                </li>

                <li><a href="#" class="main-link">Lore</a></li>
                <li><a href="#" class="main-link">Mini-jeux</a></li>
            </ul>
        </nav>
    </header>

    <!-- Page d'accueil épurée -->
    <main>
        <h1>Bienvenue dans le foutoir organisé d'<span>Hesperia</span></h1>
        <p class="subtitle">Voilà l'endroit où quelques unes de mes idées vont prendre vie !</p>
    </main> 

    <!-- Footer -->
    <footer>
        <p>Hesperia — Tous droits réservés 💜</p>
    </footer>

    <script>
        // Gestion du menu burger mobile
        const menuBtn = document.getElementById('menu-btn');
        const navLinks = document.getElementById('nav-links');

        menuBtn.onclick = () => {
            navLinks.classList.toggle('open');
            if (navLinks.classList.contains('open')) {
                menuBtn.textContent = '✕';
            } else {
                menuBtn.textContent = '☰';
            }
        };

        // Ferme le menu si on clique sur un lien
        document.querySelectorAll('nav a').forEach(link => {
            link.onclick = () => {
                navLinks.classList.remove('open');
                menuBtn.textContent = '☰';
            };
        });
    </script>
</body>
</html>
